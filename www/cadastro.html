
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="www/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">wellington gordo<span>.</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html" class="btn-nav">Cadastrar</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">✦</div>
            <h1>Crie sua conta</h1>
            <p class="subtitle">É rápido e fácil começar.</p>

            <form id="cadastroForm">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" placeholder="Digite a senha novamente" required>

                <button type="submit" class="btn-primary full">
                    Criar minha conta
                </button>

                <p id="mensagem" class="mensagem"></p>
            </form>

            <p class="switch-page">
                Já tem uma conta?
                <a href="login.html">Fazer login</a>
            </p>
            <a href="index.html" class="back-link">← Voltar para Home</a>
        </section>
    </main>

    <script>
        document.getElementById("cadastroForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmar").value;
            const mensagem = document.getElementById("mensagem");

            if (senha !== confirmar) {
                mensagem.textContent = "As senhas não coincidem.";
                return;
            }

            if (localStorage.getItem("usuario")) {
                const existente = JSON.parse(localStorage.getItem("usuario"));

                if (existente.email === email) {
                    mensagem.textContent = "Este e-mail já está cadastrado.";
                    return;
                }
            }

            const usuario = { nome, email, senha };

            localStorage.setItem("usuario", JSON.stringify(usuario));

            mensagem.textContent = "Cadastro realizado! Redirecionando...";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);
        });
    </script>

</body>
</html>
